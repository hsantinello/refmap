name: Publicar

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: 0.0.15)'
        required: false
      platform:
        description: 'Quais plataformas buildar'
        required: false
        default: all
        type: choice
        options: [all, windows, mac, linux]

permissions:
  contents: write

jobs:
  # Cria a release ANTES dos builds. Sem este job, os dois electron-builder
  # (Windows e Mac) corriam para criar a MESMA release: quem chegava depois
  # tomava 422 "Published releases must have a valid tag" e não subia nada.
  # Na v0.0.27 passou por sorte de tempo; na v0.0.28 o Mac perdeu a corrida.
  # Com a release já existindo e publicada, os builds apenas sobem os arquivos.
  release:
    name: Criar a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Montar descrição da release
        id: notas
        shell: bash
        # O corpo vem do changelog.json, mesma fonte do sininho no app. Sem ele
        # a release sai sem descrição e quem ainda não atualizou não vê as
        # novidades — o changelog embarcado no app dele para na versão instalada.
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            node scripts/release-notes.mjs "${{ github.event.inputs.version || '0.0.0' }}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '0.0.0' }}
          name: "Ref Map v${{ github.event.inputs.version || '0.0.0' }}"
          body: ${{ steps.notas.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    # UMA MÁQUINA POR ARQUITETURA. Antes os dois DMGs saíam da mesma máquina
    # arm64, e o npm instala os binários nativos (better-sqlite3, sharp, ffmpeg)
    # só para a arquitetura de quem roda: o DMG Intel da v0.0.34 levou tudo em
    # arm64 e nem abria. O scripts/after-pack.cjs confere a arquitetura de cada
    # binário e derruba o build antes de publicar se algo vier errado.
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: release
    # Permite reprocessar só o Mac sem republicar um Windows que já está no ar.
    if: ${{ inputs.platform == 'all' || inputs.platform == 'mac' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --publish always é obrigatório: sem ele o electron-builder só builda e
        # o latest-mac.yml nunca sobe, deixando o auto-update cego.
        # NÃO usar --universal: o @electron/universal junta os arquivos que diferem
        # entre x64 e arm64 num único padrão de minimatch, e com sharp +
        # better-sqlite3 + ffmpeg-static isso passa do limite de 64 KB
        # ("pattern is too long"), quebrando o build do Mac desde a v0.0.18.
        # Dois DMGs separados evitam esse passo por completo.
        # CSC_IDENTITY_AUTO_DISCOVERY false: sem certificado da Apple; a
        # assinatura ad-hoc é feita no after-pack.
        run: npx electron-vite build && npx electron-builder --mac --${{ matrix.arch }} --publish always

  build-win:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: release
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --publish always é obrigatório: sem ele o electron-builder só builda e
        # o latest.yml nunca sobe, deixando o auto-update cego.
        run: npx electron-vite build && npx electron-builder --win --publish always

  build-linux:
    # AppImage (roda em qualquer distribuição e se atualiza sozinho) + .deb
    # (Ubuntu/Debian). Compilado em Ubuntu x64: os binários nativos (better-sqlite3,
    # sharp, ffmpeg) saem para x64, a mesma arquitetura dos pacotes.
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    needs: release
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # sharp NATIVO derruba o app no Linux (segmentation fault em qualquer
      # operação): o Electron carrega a GLib do sistema e a libvips do sharp traz a
      # própria — duas GLib no mesmo processo. A versão WebAssembly não usa
      # biblioteca do sistema. Testado no WSL2: miniatura 2000→900 px em ~0,4 s.
      # O scripts/after-pack.cjs derruba o build se o nativo voltar ao pacote.
      - name: sharp WebAssembly no lugar do nativo
        run: |
          V=$(node -p "require('./node_modules/sharp/package.json').version")
          npm install --no-save --force --no-audit --no-fund "@img/sharp-wasm32@$V"
          rm -rf node_modules/@img/sharp-linux-* node_modules/@img/sharp-libvips-linux* node_modules/@img/sharp-linuxmusl-* node_modules/@img/sharp-libvips-linuxmusl-*
          ls node_modules/@img

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --publish always: sobe o latest-linux.yml, que o AppImage usa para se atualizar.
        run: npx electron-vite build && npx electron-builder --linux --x64 --publish always
