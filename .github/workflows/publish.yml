name: Publicar

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: 0.0.15)'
        required: false
      platform:
        description: 'Quais plataformas buildar'
        required: false
        default: all
        type: choice
        options: [all, windows, mac]

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (x64 + arm64)
    runs-on: macos-latest
    # Permite reprocessar só o Mac sem republicar um Windows que já está no ar.
    if: ${{ inputs.platform == 'all' || inputs.platform == 'mac' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --publish always é obrigatório: sem ele o electron-builder só builda e
        # o latest-mac.yml nunca sobe, deixando o auto-update cego.
        # NÃO usar --universal: o @electron/universal junta os arquivos que diferem
        # entre x64 e arm64 num único padrão de minimatch, e com sharp +
        # better-sqlite3 + ffmpeg-static isso passa do limite de 64 KB
        # ("pattern is too long"), quebrando o build do Mac desde a v0.0.18.
        # Dois DMGs separados evitam esse passo por completo.
        run: npx electron-vite build && npx electron-builder --mac --publish always

      - name: Publicar no Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '0.0.0' }}
          name: "Ref Map v${{ github.event.inputs.version || '0.0.0' }}"
          draft: false
          prerelease: false
          # Rede de segurança: se o publish do electron-builder falhar, os
          # metadados do updater ainda sobem por aqui.
          files: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    name: Build Windows (x64)
    runs-on: windows-latest
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --publish always é obrigatório: sem ele o electron-builder só builda e
        # o latest.yml nunca sobe, deixando o auto-update cego.
        run: npx electron-vite build && npx electron-builder --win --publish always

      - name: Publicar no Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '0.0.0' }}
          name: "Ref Map v${{ github.event.inputs.version || '0.0.0' }}"
          draft: false
          prerelease: false
          # Rede de segurança: se o publish do electron-builder falhar, os
          # metadados do updater ainda sobem por aqui.
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
