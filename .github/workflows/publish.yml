name: Publicar

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: 0.0.15)'
        required: false
      platform:
        description: 'Quais plataformas buildar'
        required: false
        default: all
        type: choice
        options: [all, windows, mac]

permissions:
  contents: write

jobs:
  # Cria a release ANTES dos builds. Sem este job, os dois electron-builder
  # (Windows e Mac) corriam para criar a MESMA release: quem chegava depois
  # tomava 422 "Published releases must have a valid tag" e não subia nada.
  # Na v0.0.27 passou por sorte de tempo; na v0.0.28 o Mac perdeu a corrida.
  # Com a release já existindo e publicada, os builds apenas sobem os arquivos.
  release:
    name: Criar a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Montar descrição da release
        id: notas
        shell: bash
        # O corpo vem do changelog.json, mesma fonte do sininho no app. Sem ele
        # a release sai sem descrição e quem ainda não atualizou não vê as
        # novidades — o changelog embarcado no app dele para na versão instalada.
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            node scripts/release-notes.mjs "${{ github.event.inputs.version || '0.0.0' }}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '0.0.0' }}
          name: "Ref Map v${{ github.event.inputs.version || '0.0.0' }}"
          body: ${{ steps.notas.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    name: Build macOS (x64 + arm64)
    runs-on: macos-latest
    needs: release
    # Permite reprocessar só o Mac sem republicar um Windows que já está no ar.
    if: ${{ inputs.platform == 'all' || inputs.platform == 'mac' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --publish always é obrigatório: sem ele o electron-builder só builda e
        # o latest-mac.yml nunca sobe, deixando o auto-update cego.
        # NÃO usar --universal: o @electron/universal junta os arquivos que diferem
        # entre x64 e arm64 num único padrão de minimatch, e com sharp +
        # better-sqlite3 + ffmpeg-static isso passa do limite de 64 KB
        # ("pattern is too long"), quebrando o build do Mac desde a v0.0.18.
        # Dois DMGs separados evitam esse passo por completo.
        run: npx electron-vite build && npx electron-builder --mac --publish always

  build-win:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: release
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --publish always é obrigatório: sem ele o electron-builder só builda e
        # o latest.yml nunca sobe, deixando o auto-update cego.
        run: npx electron-vite build && npx electron-builder --win --publish always
